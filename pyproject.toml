[project]
name = "veridex"
version = "0.1.0"
description = "Veridex: Universal, Ontology-Driven, Explainable Simulation and Optimization Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "networkx>=3.2",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]
advanced-math = [
    "salib>=1.4.7",
    "simpy>=4.1.1",
]
databricks = [
    "databricks-sql-connector>=3.0.0",
    "databricks-sdk>=0.20.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "mathematical_engine*",
    "connectors*",
    "ontology_service*",
    "dag_service*",
    "model_service*",
    "explainability_service*",
    "orchestration*",
    "persistence*",
    "api*",
]

[tool.pytest.ini_options]
testpaths = ["tests", "mathematical_engine/tests"]
pythonpath = ["."]
addopts = "-v"
